[plugin]
id = "eldenring"
name = "Elden Ring"
short_name = "ER"
version = "1.2.0"
author = "NYA Core"
description = "Elden Ring autosplitter with full boss tracking including Shadow of the Erdtree DLC"
update_url = "https://raw.githubusercontent.com/valkyaha/NYA-Core-Assets/main/plugins/eldenring/plugin.toml"

# Save file location for practice mode backup/restore
save_location_windows = "%APPDATA%/EldenRing"
save_location_linux = "~/.local/share/Steam/userdata"
save_type = "folder"

[process]
names = ["eldenring.exe"]
